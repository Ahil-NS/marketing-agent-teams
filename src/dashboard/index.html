<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAT Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <svg class="navbar-logo" viewBox="0 0 32 32" width="28" height="28">
        <rect x="2" y="2" width="28" height="28" rx="6" fill="#e94560"/>
        <text x="16" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">M</text>
      </svg>
      <span class="navbar-title">MAT Dashboard</span>
    </div>
    <ul class="navbar-nav">
      <li>
        <a href="#pipeline" class="nav-link" data-view="pipeline">
          <span class="nav-icon">&#9654;</span>
          Pipeline
        </a>
      </li>
      <li>
        <a href="#review" class="nav-link" data-view="review">
          <span class="nav-icon">&#9998;</span>
          Review
        </a>
      </li>
      <li>
        <a href="#history" class="nav-link" data-view="history">
          <span class="nav-icon">&#128197;</span>
          History
        </a>
      </li>
      <li>
        <a href="#context" class="nav-link" data-view="context">
          <span class="nav-icon">&#9881;</span>
          Context
        </a>
      </li>
    </ul>
    <div class="navbar-status">
      <span class="sse-indicator" id="sse-indicator" title="SSE disconnected"></span>
    </div>
  </nav>

  <main id="app" class="app-container">
    <div class="loading-placeholder">
      <p>Loading dashboard...</p>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/pipeline-view.js"></script>
  <script src="/js/review-view.js"></script>
  <script src="/js/history-view.js"></script>
  <script src="/js/context-view.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      MAT.router.init();
    });
  </script>
</body>
</html>
